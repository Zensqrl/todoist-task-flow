name: HACS Action
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
jobs:
  hacs_validation:
    runs-on: ubuntu-latest
    name: HACS Action
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: HACS Action
        uses: hacs/action@main
        with:
          category: "plugin"
